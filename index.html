<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b63"><title>토익스타트 리스닝 단어암기</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<meta name="application-name" content="토익스타트 리스닝 단어암기">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="토익 단어암기">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --navy:#173b63; --navy2:#24527f; --soft:#eef4fa; --accent:#2563eb; --good:#0f766e;
  --row-h:46px; --bottom:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--card);padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.titlebar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px}
.title{font-size:20px;line-height:1.18;font-weight:800;letter-spacing:-.45px;color:var(--navy);min-width:0}
.progress{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;flex:0 0 auto}
.daystrip{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 9px;scrollbar-width:none;border-top:1px solid #f3f4f6}
.daystrip::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:750;white-space:nowrap}
.daybtn.active{background:var(--navy);border-color:var(--navy);color:white}
.daybtn.done:not(.active)::after{content:' ✓';color:var(--good)}
.controls{position:sticky;top:var(--sticky-topbar,104px);z-index:15;background:white;border-bottom:1px solid var(--line);padding:8px 10px 7px}
.controlrow{display:flex;gap:6px;align-items:center}
.mode{flex:1;border:1px solid var(--line);border-radius:10px;background:#fff;height:38px;font-size:13.5px;font-weight:750;color:#4b5563;padding:0 7px}
.mode.active{background:var(--soft);border-color:#bfd0e2;color:var(--navy)}
.smallbtn{flex:0 0 auto;border:0;background:#f3f4f6;color:#4b5563;height:38px;border-radius:10px;padding:0 10px;font-size:13px;font-weight:750}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--muted)}
.meta strong{color:var(--navy)}
.complete{border:0;background:transparent;color:var(--navy2);font-weight:800;padding:0}
.complete.done{color:var(--good)}
.listhead{display:grid;grid-template-columns:32px 36px minmax(108px,1fr) minmax(116px,1fr);align-items:center;height:30px;padding:0 8px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:#9ca3af;position:sticky;top:calc(var(--sticky-topbar,104px) + var(--sticky-controls,73px));z-index:10}
.rows{background:#fff}
.row{display:grid;grid-template-columns:32px 36px minmax(108px,1fr) minmax(116px,1fr);align-items:center;min-height:var(--row-h);padding:0 8px;border-bottom:1px solid #edf0f3;cursor:pointer}
.row:active{background:#f8fafc}
.num{text-align:center;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums}
.checkwrap{display:flex;justify-content:center;align-items:center;height:100%}
.check{appearance:none;width:21px;height:21px;border:1.6px solid #aeb7c2;border-radius:5px;background:#fff;position:relative;margin:0}
.check:checked{background:var(--navy);border-color:var(--navy)}
.check:checked::after{content:'✓';position:absolute;color:white;font-weight:900;font-size:15px;left:3px;top:-1px}
.en,.ko{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en{font-size:16.5px;font-weight:760;letter-spacing:-.1px;padding-right:8px}
.ko{font-size:15.5px;color:#374151}
.pos{font-size:11.5px;color:#9ca3af;margin-right:5px;font-weight:700}
.hiddenCell{display:flex;align-items:center;width:100%;height:30px}
.hiddenPill{display:inline-flex;align-items:center;justify-content:center;height:27px;min-width:76px;border-radius:7px;background:repeating-linear-gradient(135deg,#eef1f5,#eef1f5 5px,#e5e9ef 5px,#e5e9ef 10px);color:#77808b;font-size:11.5px;font-weight:800;padding:0 8px}
.daybadge{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:24px;border-radius:6px;background:var(--soft);color:var(--navy);font-size:11.5px;font-weight:800;margin-right:6px}
.empty{padding:70px 20px;text-align:center;color:#6b7280}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:8px}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(720px,100%);height:calc(var(--bottom) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.navbtn{border:0;background:transparent;color:#8a929c;font-size:13px;font-weight:800;display:flex;gap:4px;flex-direction:column;align-items:center;justify-content:center}
.navbtn .ico{font-size:22px;line-height:22px}
.navbtn.active{color:var(--navy)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);background:#111827;color:white;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;z-index:50}
.toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}
@media (max-width:380px){
  :root{--row-h:44px}
  .titlebar{padding:0 10px}.daystrip{padding-left:9px;padding-right:9px}
  .controls{padding-left:7px;padding-right:7px}.controlrow{gap:4px}
  .mode{font-size:12.5px;padding:0 4px}.smallbtn{padding:0 7px;font-size:12px}
  .listhead,.row{grid-template-columns:26px 31px minmax(96px,1fr) minmax(106px,1fr);padding-left:5px;padding-right:5px}
  .title{font-size:17px}.progress{font-size:11.5px}
  .en{font-size:15.5px}.ko{font-size:14.5px}.check{width:20px;height:20px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="titlebar"><div class="title">토익스타트 리스닝 단어암기</div><div class="progress">20일 · 1,000단어</div></div>
    <div class="daystrip" id="daystrip"></div>

  <div class="controls">

    </div>
    <div class="meta"><span id="countText"></span><button class="complete" id="completeBtn">학습 완료</button></div>
  </div>
  <div class="listhead"><span>번호</span><span></span><span id="listLabelEn">영어</span><span>뜻</span></div>
  <div class="rows" id="rows"></div>
</div>
<nav class="bottomnav">
  <button class="navbtn active" data-tab="words"><span class="ico">▤</span><span>단어장</span></button>
  <button class="navbtn" data-tab="checked"><span class="ico">✓</span><span>체크단어</span></button>
</nav>

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
const state = {
  day: store.get('wm_day',1),
  mode: store.get('wm_mode','ko'), // all | en | ko
  tab: 'words',
  checked: new Set(store.get('wm_checked',[])),
  completed: new Set(store.get('wm_completed',[]).map(Number)),
  revealed: new Set(),
  shuffled:false,
  order:null,
  revealAll:false
};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const keyFor = (day,n)=>`${day}-${n}`;

function save(){
  store.set('wm_day',state.day); store.set('wm_mode',state.mode);
  store.set('wm_checked',[...state.checked]); store.set('wm_completed',[...state.completed]);
}
function currentWords(){
  let arr;
  if(state.tab==='checked'){
    arr=[];
    for(let d=1;d<=20;d++) for(const w of WORDS[d]) if(state.checked.has(keyFor(d,w.n))) arr.push({...w,day:d});
  } else arr=WORDS[state.day].map(w=>({...w,day:state.day}));
  if(state.shuffled){
    if(!state.order || state.order.length!==arr.length){state.order=arr.map((_,i)=>i).sort(()=>Math.random()-.5)}
    arr=state.order.map(i=>arr[i]).filter(Boolean);
  }
  return arr;
}
function renderDays(){
  const wrap=$('#daystrip'); wrap.innerHTML='';
  for(let d=1;d<=20;d++){
    const b=document.createElement('button'); b.className='daybtn'+(d===state.day?' active':'')+(state.completed.has(d)?' done':'');
    b.textContent=`${d}일`; b.onclick=()=>{state.day=d;state.tab='words';state.revealed.clear();state.revealAll=false;state.shuffled=false;state.order=null;save();render(); setTimeout(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),0)};
    wrap.appendChild(b);
  }
}
function renderControls(){
  $$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  $('#shuffleBtn').textContent=state.shuffled?'원래순서':'섞기';
  $('#revealBtn').textContent=state.revealAll?'다시 가리기':'모두 보기';
  const count=state.tab==='checked'?state.checked.size:WORDS[state.day].length;
  const checkedHere=state.tab==='checked'?state.checked.size:WORDS[state.day].filter(w=>state.checked.has(keyFor(state.day,w.n))).length;
  $('#countText').innerHTML=state.tab==='checked'?`체크 단어 <strong>${count}</strong>개`:`${state.day}일 · <strong>${count}</strong>단어 · 체크 ${checkedHere}`;
  const cb=$('#completeBtn');
  cb.style.display=state.tab==='words'?'block':'none'; cb.classList.toggle('done',state.completed.has(state.day)); cb.textContent=state.completed.has(state.day)?'✓ 학습 완료':'학습 완료';
  $('#listLabelEn').textContent=state.tab==='checked'?'영어':'영어';
}
function cellContent(w,side){
  const k=keyFor(w.day,w.n), hidden = state.mode===side && !state.revealAll && !state.revealed.has(k);
  if(hidden) return `<span class="hiddenCell"><span class="hiddenPill">${side==='en'?'영어 보기':'뜻 보기'}</span></span>`;
  if(side==='en') return escapeHtml(w.en);
  return `<span class="pos">${escapeHtml(w.pos)}</span>${escapeHtml(w.ko)}`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderRows(){
  const wrap=$('#rows'); const arr=currentWords(); wrap.innerHTML='';
  if(!arr.length){wrap.innerHTML='<div class="empty"><b>체크한 단어가 없습니다.</b>외우기 어려운 단어의 체크박스를 눌러 모아보세요.</div>';return}
  for(const w of arr){
    const k=keyFor(w.day,w.n), row=document.createElement('div'); row.className='row';
    const num = state.tab==='checked' ? `<span class="daybadge">${w.day}일</span>` : String(w.n).padStart(2,'0');
    row.innerHTML=`<div class="num">${state.tab==='checked'?num:String(w.n).padStart(2,'0')}</div>
      <div class="checkwrap"><input class="check" type="checkbox" ${state.checked.has(k)?'checked':''} aria-label="체크"></div>
      <div class="en">${cellContent(w,'en')}</div><div class="ko">${cellContent(w,'ko')}</div>`;
    const chk=row.querySelector('.check');
    chk.onclick=e=>e.stopPropagation();
    chk.onchange=()=>{if(chk.checked)state.checked.add(k);else state.checked.delete(k);save(); if(state.tab==='checked')render(); else {renderControls();toast(chk.checked?'체크 단어에 추가했습니다.':'체크를 해제했습니다.')}};
    row.onclick=()=>{
      if(state.mode==='all')return;
      if(state.revealed.has(k)) state.revealed.delete(k); else state.revealed.add(k);
      const cells=row.querySelectorAll('.en,.ko'); cells[0].innerHTML=cellContent(w,'en'); cells[1].innerHTML=cellContent(w,'ko');
    };
    wrap.appendChild(row);
  }
}
function renderNav(){
  $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  $('#daystrip').style.display=state.tab==='words'?'flex':'none';
}
function syncStickyOffsets(){
  const topbar=document.querySelector('.topbar');
  const controls=document.querySelector('.controls');
  if(!topbar||!controls)return;
  document.documentElement.style.setProperty('--sticky-topbar',`${topbar.offsetHeight}px`);
  document.documentElement.style.setProperty('--sticky-controls',`${controls.offsetHeight}px`);
}
function render(){renderDays();renderControls();renderRows();renderNav();requestAnimationFrame(syncStickyOffsets);}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),1300)}

$$('.mode').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.revealed.clear();state.revealAll=false;save();render()});
$('#shuffleBtn').onclick=()=>{state.shuffled=!state.shuffled;state.order=null;render()};
$('#revealBtn').onclick=()=>{if(state.mode==='all'){toast('가리기 모드에서 사용할 수 있습니다.');return}state.revealAll=!state.revealAll;state.revealed.clear();render()};
$('#completeBtn').onclick=()=>{if(state.completed.has(state.day))state.completed.delete(state.day);else state.completed.add(state.day);save();render()};
$$('.navbtn').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.revealed.clear();state.revealAll=false;state.shuffled=false;state.order=null;render();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))});
window.addEventListener('resize',()=>requestAnimationFrame(syncStickyOffsets));
render();
setTimeout(()=>{const a=document.querySelector('.daybtn.active'); if(a)a.scrollIntoView({inline:'center',block:'nearest'})},100);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
