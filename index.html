<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b63">
<title>토익스타트 리스닝 단어암기</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<meta name="application-name" content="토익스타트 리스닝 단어암기">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="토익 단어암기">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<style>
:root{
  --bg:#eef2f7;
  --card:#ffffff;
  --ink:#111827;
  --muted:#6b7280;
  --line:#dde5ed;
  --navy:#173b63;
  --navy2:#24527f;
  --soft:#eef4fa;
  --study:#f3f7fb;
  --study-row:#f8fbfe;
  --study-head:#eaf1f7;
  --accent:#2563eb;
  --good:#0f766e;
  --star:#d49a1d;
  --row-h:48px;
  --bottom:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--study);padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom))}

.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.titlebar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px;background:#fff}
.title{font-size:20px;line-height:1.18;font-weight:800;letter-spacing:-.45px;color:var(--navy);min-width:0}
.progress{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;flex:0 0 auto}

.daystrip{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 9px;scrollbar-width:none;border-top:1px solid #f1f3f6;background:var(--study)}
.daystrip::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;border:1px solid #d8e1ea;background:#fbfdff;color:#4b5563;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:750;white-space:nowrap}
.daybtn.active{background:var(--navy);border-color:var(--navy);color:white}
.daybtn.done:not(.active)::after{content:' ✓';color:var(--good)}

.controls{position:sticky;top:var(--sticky-topbar,104px);z-index:15;background:rgba(243,247,251,.98);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 10px 7px}
.controlrow{display:flex;gap:6px;align-items:center}
.mode{flex:1;border:1px solid #d8e1ea;border-radius:10px;background:#fbfdff;height:38px;font-size:13.5px;font-weight:750;color:#4b5563;padding:0 7px}
.mode.active{background:#e8f0f8;border-color:#b8ccdf;color:var(--navy)}
.smallbtn{flex:0 0 auto;border:0;background:#e8edf3;color:#4b5563;height:38px;border-radius:10px;padding:0 10px;font-size:13px;font-weight:750}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--muted)}
.meta strong{color:var(--navy)}
.complete{border:0;background:transparent;color:var(--navy2);font-weight:800;padding:0}
.complete.done{color:var(--good)}

.listhead{
  display:grid;
  grid-template-columns:24px 28px 24px minmax(140px,1.22fr) minmax(96px,.78fr);
  align-items:center;
  height:30px;
  padding:0 5px;
  background:var(--study-head);
  border-bottom:1px solid var(--line);
  font-size:11.5px;
  font-weight:800;
  color:#8793a1;
  position:sticky;
  top:calc(var(--sticky-topbar,104px) + var(--sticky-controls,73px));
  z-index:10
}
.starhead{text-align:center;color:#b0a17c}

.rows{background:var(--study)}
.row{
  display:grid;
  grid-template-columns:24px 28px 24px minmax(140px,1.22fr) minmax(96px,.78fr);
  align-items:center;
  min-height:var(--row-h);
  padding:0 5px;
  border-bottom:1px solid #e4eaf0;
  background:var(--study-row);
}
.row:active{background:#f1f6fb}
.num{text-align:center;font-size:12px;color:#96a1ae;font-variant-numeric:tabular-nums}
.checkwrap,.starwrap{display:flex;justify-content:center;align-items:center;height:100%}

.check{appearance:none;width:20px;height:20px;border:1.6px solid #aeb7c2;border-radius:5px;background:#fff;position:relative;margin:0}
.check:checked{background:var(--navy);border-color:var(--navy)}
.check:checked::after{content:'✓';position:absolute;color:white;font-weight:900;font-size:15px;left:3px;top:-1px}

.starbtn{border:0;background:transparent;color:#aeb7c2;font-size:22px;line-height:1;padding:0;width:24px;height:32px;display:flex;align-items:center;justify-content:center}
.starbtn.active{color:var(--star);text-shadow:0 1px 0 rgba(0,0,0,.04)}

.en,.ko{min-width:0;overflow:hidden}
.en{font-size:16.5px;font-weight:760;letter-spacing:-.1px;padding-right:8px;cursor:pointer}
.ko{font-size:15.5px;color:#374151;cursor:pointer}
.enVisible{display:flex;flex-direction:column;justify-content:center;min-width:0}
.enword{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.word-expanded{align-items:start;padding-top:7px;padding-bottom:7px}
.row.word-expanded .en{overflow:visible}
.row.word-expanded .enVisible{overflow:visible}
.row.word-expanded .enword{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.28;word-break:normal}
.row.word-expanded .ko{padding-top:2px}
.row.word-expanded .num,
.row.word-expanded .checkwrap,
.row.word-expanded .starwrap{padding-top:2px}
.pron{font-size:11.8px;line-height:1.15;font-weight:650;color:#718096;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{font-size:11.5px;color:#9ca3af;margin-right:5px;font-weight:700}
.hiddenCell{display:flex;align-items:center;width:100%;height:30px}
.hiddenPill{display:inline-flex;align-items:center;justify-content:center;height:27px;min-width:74px;border-radius:7px;background:repeating-linear-gradient(135deg,#edf1f5,#edf1f5 5px,#e3e8ee 5px,#e3e8ee 10px);color:#77808b;font-size:11.5px;font-weight:800;padding:0 8px}

.daybadge{display:inline-flex;align-items:center;justify-content:center;min-width:31px;height:22px;border-radius:6px;background:#e5eef7;color:var(--navy);font-size:10.5px;font-weight:800}
.empty{padding:70px 20px;text-align:center;color:#6b7280}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:8px}

.bottomnav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;
  width:min(720px,100%);height:calc(var(--bottom) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:rgba(255,255,255,.98);backdrop-filter:blur(14px);border-top:1px solid var(--line)
}
.navbtn{border:0;background:transparent;color:#8a929c;font-size:12.5px;font-weight:800;display:flex;gap:3px;flex-direction:column;align-items:center;justify-content:center}
.navbtn .ico{font-size:21px;line-height:21px}
.navbtn.active{color:var(--navy)}
.navbtn[data-tab="important"].active .ico{color:var(--star)}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);background:#111827;color:white;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.18s;z-index:50}
.toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}

@media (max-width:380px){
  :root{--row-h:46px}
  .titlebar{padding-left:10px;padding-right:10px}
  .daystrip{padding-left:9px;padding-right:9px}
  .controls{padding-left:7px;padding-right:7px}
  .controlrow{gap:4px}
  .mode{font-size:12.3px;padding:0 4px}
  .smallbtn{padding:0 7px;font-size:12px}
  .listhead,.row{grid-template-columns:22px 26px 22px minmax(132px,1.22fr) minmax(92px,.78fr);padding-left:3px;padding-right:3px}
  .title{font-size:17px}
  .progress{font-size:11.5px}
  .en{font-size:15.5px}
  .ko{font-size:14.5px}
  .check{width:19px;height:19px}
  .starbtn{font-size:21px;width:22px}
  .navbtn{font-size:11.8px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="titlebar">
      <div class="title">토익스타트 리스닝 단어암기</div>
      <div class="progress">20일 · 1,000단어</div>
    </div>
    <div class="daystrip" id="daystrip"></div>
  </div>

  <div class="controls">
    <div class="controlrow">
      <button class="mode" data-mode="all">전체 보기</button>
      <button class="mode" data-mode="en">영어가려</button>
      <button class="mode active" data-mode="ko">뜻가려</button>
      <button class="smallbtn" id="revealBtn">모두 보기</button>
      <button class="smallbtn" id="shuffleBtn">섞기</button>
    </div>
    <div class="meta">
      <span id="countText"></span>
      <button class="complete" id="completeBtn">학습 완료</button>
    </div>
  </div>

  <div class="listhead">
    <span>번호</span><span></span><span class="starhead">★</span><span>영어</span><span>뜻</span>
  </div>
  <div class="rows" id="rows"></div>
</div>

<nav class="bottomnav">
  <button class="navbtn active" data-tab="words"><span class="ico">▤</span><span>단어장</span></button>
  <button class="navbtn" data-tab="checked"><span class="ico">✓</span><span>체크단어</span></button>
  <button class="navbtn" data-tab="important"><span class="ico">★</span><span>중요단어</span></button>
</nav>

<div class="toast" id="toast"></div>

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};

const state = {
  day: store.get('wm_day',1),
  mode: store.get('wm_mode','ko'),
  tab: 'words',
  checked: new Set(store.get('wm_checked',[])),
  important: new Set(store.get('wm_important',[])),
  completed: new Set(store.get('wm_completed',[]).map(Number)),
  revealed: new Set(),
  pronShown: new Set(),
  expandedWords: new Set(),
  shuffled:false,
  order:null,
  revealAll:false
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const keyFor = (day,n)=>`${day}-${n}`;

function save(){
  store.set('wm_day',state.day);
  store.set('wm_mode',state.mode);
  store.set('wm_checked',[...state.checked]);
  store.set('wm_important',[...state.important]);
  store.set('wm_completed',[...state.completed]);
}

function currentWords(){
  let arr;
  if(state.tab==='checked'){
    arr=[];
    for(let d=1;d<=20;d++) for(const w of WORDS[d])
      if(state.checked.has(keyFor(d,w.n))) arr.push({...w,day:d});
  } else if(state.tab==='important'){
    arr=[];
    for(let d=1;d<=20;d++) for(const w of WORDS[d])
      if(state.important.has(keyFor(d,w.n))) arr.push({...w,day:d});
  } else {
    arr=WORDS[state.day].map(w=>({...w,day:state.day}));
  }

  if(state.shuffled){
    if(!state.order || state.order.length!==arr.length){
      state.order=arr.map((_,i)=>i).sort(()=>Math.random()-.5);
    }
    arr=state.order.map(i=>arr[i]).filter(Boolean);
  }
  return arr;
}

function renderDays(){
  const wrap=$('#daystrip');
  wrap.innerHTML='';
  for(let d=1;d<=20;d++){
    const b=document.createElement('button');
    b.className='daybtn'+(d===state.day?' active':'')+(state.completed.has(d)?' done':'');
    b.textContent=`${d}일`;
    b.onclick=()=>{
      state.day=d;
      state.tab='words';
      state.revealed.clear();
      state.pronShown.clear();
      state.expandedWords.clear();
      state.revealAll=false;
      state.shuffled=false;
      state.order=null;
      save();
      render();
      setTimeout(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),0);
    };
    wrap.appendChild(b);
  }
}

function renderControls(){
  $$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  $('#shuffleBtn').textContent=state.shuffled?'원래순서':'섞기';
  $('#revealBtn').textContent=state.revealAll?'다시 가리기':'모두 보기';

  if(state.tab==='checked'){
    $('#countText').innerHTML=`체크 단어 <strong>${state.checked.size}</strong>개`;
  } else if(state.tab==='important'){
    $('#countText').innerHTML=`중요 단어 <strong>${state.important.size}</strong>개`;
  } else {
    const checkedHere=WORDS[state.day].filter(w=>state.checked.has(keyFor(state.day,w.n))).length;
    const importantHere=WORDS[state.day].filter(w=>state.important.has(keyFor(state.day,w.n))).length;
    $('#countText').innerHTML=`${state.day}일 · <strong>${WORDS[state.day].length}</strong>단어 · 체크 ${checkedHere} · ★ ${importantHere}`;
  }

  const cb=$('#completeBtn');
  cb.style.display=state.tab==='words'?'block':'none';
  cb.classList.toggle('done',state.completed.has(state.day));
  cb.textContent=state.completed.has(state.day)?'✓ 학습 완료':'학습 완료';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function isHidden(w,side){
  const k=keyFor(w.day,w.n);
  return state.mode===side && !state.revealAll && !state.revealed.has(k);
}

function englishContent(w){
  const k=keyFor(w.day,w.n);
  if(isHidden(w,'en')) {
    return `<span class="hiddenCell"><span class="hiddenPill">영어 보기</span></span>`;
  }
  const pron=state.pronShown.has(k) ? `<span class="pron">/${escapeHtml(w.ipa)}/</span>` : '';
  return `<span class="enVisible"><span class="enword">${escapeHtml(w.en)}</span>${pron}</span>`;
}

function koreanContent(w){
  if(isHidden(w,'ko')) {
    return `<span class="hiddenCell"><span class="hiddenPill">뜻 보기</span></span>`;
  }
  return `<span class="pos">${escapeHtml(w.pos)}</span>${escapeHtml(w.ko)}`;
}

function renderRows(){
  const wrap=$('#rows');
  const arr=currentWords();
  wrap.innerHTML='';

  if(!arr.length){
    if(state.tab==='important'){
      wrap.innerHTML='<div class="empty"><b>중요단어가 없습니다.</b>계속 틀리는 단어의 ★를 눌러 따로 모아보세요.</div>';
    } else {
      wrap.innerHTML='<div class="empty"><b>체크한 단어가 없습니다.</b>외우기 어려운 단어의 체크박스를 눌러 모아보세요.</div>';
    }
    return;
  }

  for(const w of arr){
    const k=keyFor(w.day,w.n);
    const row=document.createElement('div');
    row.className='row' + (state.expandedWords.has(k)?' word-expanded':'');

    const numberHtml = state.tab==='words'
      ? String(w.n).padStart(2,'0')
      : `<span class="daybadge">${w.day}일</span>`;

    row.innerHTML=`
      <div class="num">${numberHtml}</div>
      <div class="checkwrap">
        <input class="check" type="checkbox" ${state.checked.has(k)?'checked':''} aria-label="체크단어">
      </div>
      <div class="starwrap">
        <button class="starbtn ${state.important.has(k)?'active':''}" aria-label="중요단어">${state.important.has(k)?'★':'☆'}</button>
      </div>
      <div class="en">${englishContent(w)}</div>
      <div class="ko">${koreanContent(w)}</div>
    `;

    const chk=row.querySelector('.check');
    chk.onchange=()=>{
      if(chk.checked) state.checked.add(k);
      else state.checked.delete(k);
      save();

      if(state.tab==='checked') render();
      else {
        renderControls();
        toast(chk.checked?'체크단어에 추가했습니다.':'체크를 해제했습니다.');
      }
    };

    const star=row.querySelector('.starbtn');
    star.onclick=(e)=>{
      e.stopPropagation();
      if(state.important.has(k)) state.important.delete(k);
      else state.important.add(k);
      save();

      if(state.tab==='important'){
        render();
      } else {
        star.classList.toggle('active',state.important.has(k));
        star.textContent=state.important.has(k)?'★':'☆';
        renderControls();
        toast(state.important.has(k)?'중요단어에 추가했습니다.':'중요표시를 해제했습니다.');
      }
    };

    const enCell=row.querySelector('.en');
    enCell.onclick=(e)=>{
      e.stopPropagation();

      // 영어가려 모드에서는 첫 터치로 영어 자체를 먼저 보여줍니다.
      if(isHidden(w,'en')){
        state.revealed.add(k);
        state.expandedWords.add(k);
        enCell.innerHTML=englishContent(w);
        row.classList.add('word-expanded');
        return;
      }

      // 영어를 누르면 긴 표현을 줄바꿈해 전체 표시하고 발음기호도 같이 보여줍니다.
      // 다시 누르면 원래 한 줄 표시로 돌아갑니다.
      const opening = !state.expandedWords.has(k);
      if(opening){
        state.expandedWords.add(k);
        state.pronShown.add(k);
        row.classList.add('word-expanded');
      }else{
        state.expandedWords.delete(k);
        state.pronShown.delete(k);
        row.classList.remove('word-expanded');
      }
      enCell.innerHTML=englishContent(w);
    };

    const koCell=row.querySelector('.ko');
    koCell.onclick=(e)=>{
      e.stopPropagation();

      // 뜻가려 모드에서는 뜻 칸을 눌렀을 때만 뜻을 보여주거나 다시 가립니다.
      if(state.mode==='ko' && !state.revealAll){
        if(state.revealed.has(k)) state.revealed.delete(k);
        else state.revealed.add(k);
        koCell.innerHTML=koreanContent(w);
      }
    };

    wrap.appendChild(row);
  }
}

function renderNav(){
  $$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  $('#daystrip').style.display=state.tab==='words'?'flex':'none';
}

function syncStickyOffsets(){
  const topbar=document.querySelector('.topbar');
  const controls=document.querySelector('.controls');
  if(!topbar||!controls)return;
  document.documentElement.style.setProperty('--sticky-topbar',`${topbar.offsetHeight}px`);
  document.documentElement.style.setProperty('--sticky-controls',`${controls.offsetHeight}px`);
}

function render(){
  renderDays();
  renderControls();
  renderRows();
  renderNav();
  requestAnimationFrame(syncStickyOffsets);
}

function toast(t){
  const el=$('#toast');
  el.textContent=t;
  el.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt=setTimeout(()=>el.classList.remove('show'),1300);
}

$$('.mode').forEach(b=>b.onclick=()=>{
  state.mode=b.dataset.mode;
  state.revealed.clear();
  state.pronShown.clear();
  state.expandedWords.clear();
  state.revealAll=false;
  save();
  render();
});

$('#shuffleBtn').onclick=()=>{
  state.shuffled=!state.shuffled;
  state.order=null;
  render();
};

$('#revealBtn').onclick=()=>{
  if(state.mode==='all'){
    toast('가리기 모드에서 사용할 수 있습니다.');
    return;
  }
  state.revealAll=!state.revealAll;
  state.revealed.clear();
  render();
};

$('#completeBtn').onclick=()=>{
  if(state.completed.has(state.day)) state.completed.delete(state.day);
  else state.completed.add(state.day);
  save();
  render();
};

$$('.navbtn').forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab;
  state.revealed.clear();
  state.pronShown.clear();
  state.expandedWords.clear();
  state.revealAll=false;
  state.shuffled=false;
  state.order=null;
  render();
  requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));
});

window.addEventListener('resize',()=>requestAnimationFrame(syncStickyOffsets));
render();
setTimeout(()=>{
  const a=document.querySelector('.daybtn.active');
  if(a)a.scrollIntoView({inline:'center',block:'nearest'});
},100);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
